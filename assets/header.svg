<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4A6CF7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bgGradient)"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="220"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="500" y1="0" x2="500" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="700" y1="0" x2="700" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
  </g>

  <!-- Animated Waves -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
        M 0 160 Q 225 130 450 165 T 900 150 L 900 220 L 0 220 Z;
        M 0 150 Q 225 180 450 145 T 900 165 L 900 220 L 0 220 Z;
        M 0 160 Q 225 130 450 165 T 900 150 L 900 220 L 0 220 Z
      "/>
  </path>
  <path fill="url(#wave2)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M 0 175 Q 225 195 450 165 T 900 180 L 900 220 L 0 220 Z;
        M 0 185 Q 225 155 450 185 T 900 170 L 900 220 L 0 220 Z;
        M 0 175 Q 225 195 450 165 T 900 180 L 900 220 L 0 220 Z
      "/>
  </path>

  <!-- Glowing accent orb -->
  <circle cx="450" cy="80" r="140" fill="#4A6CF7" opacity="0.18" filter="url(#glow)"/>

  <!-- Tech Corner Markers -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#4A6CF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 880 40 L 880 20 L 860 20" stroke="#4A6CF7" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Name -->
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="url(#textGrad)">
    Nitish S
  </text>

  <!-- Subtitle Badge -->
  <g transform="translate(160, 122)">
    <rect x="0" y="0" width="580" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10B981">
      <animate attributeName="opacity" dur="2s" values="1;0.4;1" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93C5FD">
      FULL STACK DEV  •  HARDWARE SPECIALIST  •  IoT &amp; AUTOMATION
    </text>
  </g>
</svg>
